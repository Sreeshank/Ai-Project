# Both services use free demo plans. They sleep when idle; no paid resources are selected.
services:
- type: web
  name: campus-compass-api
  runtime: docker
  plan: free
  repo: https://github.com/Sreeshank/Ai-Project
  branch: main
  dockerfilePath: ./deploy/Dockerfile.backend
  dockerContext: .
  healthCheckPath: /api/health
  envVars:
  - key: DOCUMENT_BACKEND
    value: postgres
  - key: DATABASE_URL
    sync: false
  - key: GEMINI_API_KEY
    sync: false
  - key: GEMINI_MODEL
    value: gemini-3.5-flash-lite
  - key: GEMINI_FALLBACK_MODELS
    value: gemini-3.6-flash
  - key: EMBEDDING_MODEL
    value: gemini-embedding-001
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_PUBLISHABLE_KEY
    sync: false
  - key: APP_ORIGIN
    sync: false
  - key: RATE_LIMIT_ENABLED
    value: '1'
- type: web
  name: campus-compass-web
  runtime: node
  plan: free
  repo: https://github.com/Sreeshank/Ai-Project
  branch: main
  buildCommand: npm ci --include=dev && npm run build
  startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port
    $PORT
  healthCheckPath: /
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: NODE_ENV
    value: production
  - key: NEXT_TELEMETRY_DISABLED
    value: '1'
  - key: BACKEND_URL
    fromService:
      name: campus-compass-api
      type: web
      envVarKey: RENDER_EXTERNAL_URL
